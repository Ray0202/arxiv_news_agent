[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-news-agent"
version = "0.1.0"
description = "Daily arXiv digest: harvest, filter, deep-read with Claude, publish a static site."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120",
    "jsonschema>=4.20",
    "httpx>=0.27",
    "lxml>=5.0",
    "pypdf>=4.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]   # Phase 2: tier-2 semantic filter
dev = ["pytest>=8.0"]

[project.scripts]
pna = "pna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pna = ["site/templates/*.html", "site/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
